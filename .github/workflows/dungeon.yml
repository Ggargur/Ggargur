name: Generate dungeon

on:
  schedule: # once a day, new seed
    - cron: "0 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/dungeon/**"
      - ".github/workflows/dungeon.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate dungeon SVGs
        run: python scripts/dungeon/dungeon.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
